[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-rl-framework"
version = "0.1.0"
description = "A small, TensorDict-first PyTorch reinforcement learning framework"
requires-python = ">=3.10"
dependencies = [
    "torch==2.3.1",
    "tensordict==0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rlframework*"]
